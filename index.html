<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#17050d">
<title>Happy Birthday, Soumia ❤️</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  --wine: #680b25;
  --red: #e3264d;
  --gold: #f5d28b;
  --cream: #fff1db;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #090609;
  color: white;
  font-family: Georgia, "Times New Roman", serif;
}

body {
  position: relative;
}

.scene {
  position: absolute;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  text-align: center;
  overflow: hidden;
  padding: 25px;
  isolation: isolate;
  background:
    radial-gradient(ellipse at 50% 40%, #451021 0%, #170710 48%, #050406 100%);
}

.scene.active {
  display: flex;
  animation: sceneReveal 1.1s ease both;
}

@keyframes sceneReveal {
  from { opacity: 0; }
  to { opacity: 1; }
}

.scene::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  background:
    radial-gradient(ellipse at 50% 100%, #d42b4b20, transparent 55%),
    linear-gradient(180deg, #00000020, transparent 45%, #00000075);
}

h1, h2, p {
  max-width: 850px;
}

h1 {
  font-size: clamp(2.2rem, 9vw, 4.8rem);
  color: var(--gold);
  text-shadow: 0 0 20px #ffb65b75, 0 3px 8px #000;
}

h2 {
  font-size: clamp(1.6rem, 6vw, 3rem);
  color: var(--cream);
  line-height: 1.6;
}

p {
  font-size: clamp(1rem, 4vw, 1.45rem);
  line-height: 2;
}

.gold {
  color: var(--gold);
}

.english {
  direction: ltr;
  unicode-bidi: isolate;
}

.small {
  margin-top: 18px;
  color: #f8d7dc;
  font-size: 1rem;
}

button {
  border: 1px solid #f4d08a;
  color: white;
  padding: 15px 30px;
  border-radius: 50px;
  background: linear-gradient(135deg, #a40f36, #4d061a);
  box-shadow: 0 0 25px #df31514d, inset 0 0 10px #ffffff12;
  font-size: 1.15rem;
  cursor: pointer;
  font-family: inherit;
}

button:active {
  transform: scale(.96);
}

.start-card {
  position: relative;
  max-width: 460px;
  width: 100%;
  padding: 40px 24px;
  border: 1px solid #e6bd72a0;
  border-radius: 24px;
  background: linear-gradient(145deg, #3a101eeb, #10070ced);
  box-shadow: 0 20px 80px #000b, 0 0 35px #d6294b30;
}

.start-card::before,
.start-card::after {
  content: "🌹";
  position: absolute;
  font-size: 2.1rem;
  filter: drop-shadow(0 0 12px #e3264d);
}

.start-card::before {
  top: -18px;
  right: 18px;
}

.start-card::after {
  bottom: -18px;
  left: 18px;
}

.big-heart {
  color: #e3264d;
  font-size: clamp(6rem, 30vw, 11rem);
  line-height: 1.25;
  filter: drop-shadow(0 0 20px #ff174e);
  animation: heartBeat 1.6s ease-in-out infinite;
}

@keyframes heartBeat {
  0%, 100% { transform: scale(1); }
  15% { transform: scale(1.09); }
  30% { transform: scale(1); }
  45% { transform: scale(1.05); }
}

.rose {
  font-size: clamp(5rem, 23vw, 9rem);
  filter: drop-shadow(0 0 18px #b40c2e);
  animation: roseFloat 4s ease-in-out infinite;
}

@keyframes roseFloat {
  0%, 100% { transform: translateY(0) rotate(-3deg); }
  50% { transform: translateY(-10px) rotate(3deg); }
}

.number {
  font-size: clamp(8rem, 45vw, 15rem);
  font-weight: bold;
  color: #f8e8e9;
  text-shadow: 0 0 30px #e3264d, 0 0 80px #e3264d75;
  animation: numberIn 1.8s ease both;
}

@keyframes numberIn {
  0% { opacity: 0; transform: translateX(80px) scale(.65); }
  25%, 75% { opacity: 1; transform: translateX(0) scale(1); }
  100% { opacity: 0; transform: translateX(-80px) scale(1.2); }
}

.image-scene {
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
}

.image-scene::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -1;
  background: linear-gradient(180deg, #08030b55, #08030b70 60%, #08030bd9);
}

.photo-frame {
  position: absolute;
  inset: 12px;
  border: 1px solid #f5d28b80;
  pointer-events: none;
  box-shadow: inset 0 0 30px #0008;
}

.scene-content {
  width: min(100%, 700px);
  position: relative;
  z-index: 2;
  padding: 22px;
  border-radius: 18px;
  background: #10070b80;
  border: 1px solid #f5d28b30;
  backdrop-filter: blur(3px);
  box-shadow: 0 10px 40px #0007;
}

.message {
  color: #fff4e8;
  margin-top: 18px;
}

.cake {
  font-size: clamp(6rem, 25vw, 10rem);
  filter: drop-shadow(0 0 25px #f7b76350);
  animation: cakeGlow 2.5s ease-in-out infinite alternate;
}

@keyframes cakeGlow {
  from { filter: drop-shadow(0 0 12px #f7b76330); }
  to { filter: drop-shadow(0 0 35px #f7b76395); }
}

.stars {
  position: absolute;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
  z-index: 1;
}

.star {
  position: absolute;
  color: #fff0c8;
  animation: twinkle 2s infinite alternate;
  text-shadow: 0 0 10px #fff;
}

@keyframes twinkle {
  from { opacity: .25; transform: scale(.75); }
